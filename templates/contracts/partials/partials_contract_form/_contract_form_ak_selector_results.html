{% if error %}
<div class="alert alert-warning m-2 mb-0 py-2 small">{{ error }}</div>
{% elif aks %}
<div class="list-group list-group-flush">
  {% for ak in aks %}
  <label class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2 px-3">
    <input class="form-check-input ak-result-checkbox flex-shrink-0" type="checkbox"
           value="{{ ak.id }}"
           data-ak-number="{{ ak.number }}"
           data-ak-name="{{ ak.name }}"
           data-ak-address="{{ ak.address|truncatechars:60 }}">
    <div class="flex-grow-1">
      <div class="fw-semibold small">АК №{{ ak.number }} – {{ ak.name }}</div>
      <small class="text-muted">{{ ak.address }}</small>
    </div>
  </label>
  {% endfor %}
</div>
{% else %}
<div class="text-muted text-center py-4">
  <i class="bi bi-inbox me-2"></i>АК не найдены
</div>
{% endif %}
