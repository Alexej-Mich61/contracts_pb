<!-- templates/contracts/partials/partials_contract_form/_contract_form_ak_search_results.html -->
{% if aks %}
    <div class="list-group list-group-flush">
        {% for ak in aks %}
            {% if ak.id in attached_ids %}
                <div class="list-group-item list-group-item-success py-2 px-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-semibold">АК №{{ ak.number }} – {{ ak.name }}</div>
                            <small class="text-muted">{{ ak.address|truncatechars:50 }}</small>
                        </div>
                        <span class="badge bg-success"><i class="bi bi-check"></i> Привязан</span>
                    </div>
                </div>
            {% else %}
                <button type="button"
                        class="list-group-item list-group-item-action py-2 px-3"
                        hx-post="{% url 'contract_core:add_ak_to_object' contract.pk object.pk ak.pk %}"
                        hx-target="#attached-aks-{{ object.pk }}"
                        hx-swap="innerHTML"
                        hx-indicator=".ak-loading-{{ ak.id }}"
                        hx-on::after-request="document.getElementById('ak-search-results-{{ object.pk }}').style.display='none'">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-semibold">АК №{{ ak.number }} – {{ ak.name }}</div>
                            <small class="text-muted">{{ ak.address|truncatechars:50 }}</small>
                        </div>
                        <span class="ak-loading-{{ ak.id }} htmx-indicator spinner-border spinner-border-sm"></span>
                        <span class="badge bg-primary bg-opacity-10 text-primary">Добавить</span>
                    </div>
                </button>
            {% endif %}
        {% endfor %}
    </div>
{% elif query and query|length >= 2 %}
    <div class="p-3 text-muted text-center">
        <i class="bi bi-search me-2"></i>АК не найдены
    </div>
{% endif %}
