<!-- templates/contracts/partials/partials_contract_form/_contract_form_district_field.html -->
<label for="id_{{ field_name }}" class="form-label fw-semibold">
    Район
</label>
<select name="{{ field_name }}"
        id="id_{{ field_name }}"
        class="form-select district-select {{ extra_class|default:'' }}"
        {% if not districts %}disabled{% endif %}>
    {% if not districts %}
        <option value="">— Сначала выберите регион —</option>
    {% else %}
        <option value="">— Выберите район —</option>
        {% for district in districts %}
            <option value="{{ district.id }}"
                    {% if selected|stringformat:"s" == district.id|stringformat:"s" %}selected{% endif %}>
                {{ district.name }}
            </option>
        {% endfor %}
    {% endif %}
</select>
{% if field and field.errors %}
    <div class="text-danger small">{{ field.errors.0 }}</div>
{% endif %}
