<!-- templates/contracts/partials/partials_contract_form/_contract_form_customer_select.html -->
<select name="customer" id="id_customer" class="form-select">
    <option value="">— Выберите заказчика —</option>
    {% for customer in customers %}
        <option value="{{ customer.id }}" {% if customer.id|stringformat:"s" == selected %}selected{% endif %}>
            {{ customer.name }} (ИНН: {{ customer.inn }})
        </option>
    {% empty %}
        {% if query %}
            <option value="" disabled>Ничего не найдено по запросу "{{ query }}"</option>
        {% else %}
            <option value="" disabled>Введите минимум 2 символа для поиска</option>
        {% endif %}
    {% endfor %}
</select>
