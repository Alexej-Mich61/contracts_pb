<!--templates/contracts/partials/contract_stats_bar.html-->
{% load humanize %}

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <!-- Лево: создание (только для авторизованных с правом) -->
    {% if user.can_add_contract %}
    <div>
        <a href="{% url 'contract_core:contract_create' %}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Новый договор
        </a>
    </div>
    {% else %}
    <!-- Пустой placeholder чтобы верстка не ехала при отсутствии кнопки -->
    <div></div>
    {% endif %}

    <!-- Центр: счетчики -->
    <div class="d-flex gap-4 flex-wrap justify-content-center align-items-baseline">
        <div class="text-center">
            <div class="text-muted small">Договоров</div>
            <div class="fw-bold fs-5 text-primary">{{ total_contracts }}</div>
        </div>
        <div class="text-center">
            <div class="text-muted small">Объектов</div>
            <div class="fw-bold fs-5 text-info">{{ total_objects }}</div>
        </div>
        <div class="text-center">
            <div class="text-muted small">АК</div>
            <div class="fw-bold fs-5 text-secondary">{{ total_aks }}</div>
        </div>
        <div class="text-center">
            <div class="text-muted small">Сумма общая</div>
            <div class="fw-bold fs-5 text-success">{{ total_sum|floatformat:0|intcomma }} ₽</div>
        </div>
        <div class="text-center">
            <div class="text-muted small">Сумма в месяц</div>
            <div class="fw-bold fs-5 text-warning">{{ total_monthly_sum|floatformat:0|intcomma }} ₽</div>
        </div>
    </div>

    <!-- Право: экспорт -->
    <div>
        <a href="{% url 'contract_core:contract_export_excel' %}?{{ request.META.QUERY_STRING }}"
           class="btn btn-success">
            <i class="bi bi-file-earmark-excel"></i> Экспорт в Excel
        </a>
    </div>
</div>
